# Layer 1/3 — global defaults, applied to every environment on every cluster.
# Overridden by envs/tiers/<tier>.yaml, then envs/<environment>.yaml.
# Put values here only when they are true everywhere.

# RULED OUT — do not re-add a securityContext override on this rung.
#
# This file used to pin runAsUser: 100 / runAsGroup: 100 /
# readOnlyRootFilesystem: false, on the theory that the chart's hardened
# defaults (runAsUser: 10001, readOnlyRootFilesystem: true, no writable volume)
# were what crash-looped podinfo. That was wrong — and because this rung applies
# everywhere, it silently de-hardened team1-prod as well as team1-dev.
#
# The real cause was CPU ARCHITECTURE. docker.io/mkandylis/podinfo v0.1, v0.2
# and v0.3 are all the SAME digest and all linux/arm64 only, while the EKS nodes
# are amd64 — so the kernel could not exec the binary at all:
#
#   exec ./podinfo: exec format error
#
# Every securityContext experiment was therefore run against a binary that could
# never start, and none of them could have come up Healthy no matter what was
# set. Fixed by v0.4, a real multi-arch (amd64 + arm64) manifest.
#
# Re-verified after the fix, running the amd64 image directly:
#   --read-only               -> starts, serves HTTP
#   --user 10001              -> starts, serves HTTP
#   --read-only --user 10001  -> starts, serves HTTP
#
# So the chart's hardened defaults are correct and are deliberately left in
# force. podinfo is started with `--port` and `--level` only; the write paths
# behind /store are unused here, which is why a read-only root filesystem costs
# nothing.

analysis:
  enabled: false
monitoring:
  enabled: false
ingress:
  enabled: false
