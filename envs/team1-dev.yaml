# Layer 3/3 — dev environment. Only what differs from defaults + nonprod tier.
# image.tag is written by the Harness UpdateReleaseRepo step — keep it here.
#
# v0.3 below is STALE and still crash-loops. Leave it — the next run of
# podinfo_dev_sync must overwrite it with v0.4, which is what makes that run a
# real test of the pipeline rather than a no-op.
#
# Why v0.3 never had a chance: v0.1, v0.2 and v0.3 are all the SAME digest and
# all linux/arm64 only, while the EKS nodes are amd64 —
# "exec ./podinfo: exec format error". So the tag bump to v0.3 isolated nothing;
# it redeployed a byte-identical unrunnable image. v0.4 is the first genuinely
# different artifact: a multi-arch (amd64 + arm64) manifest.
#
# Both earlier suspects are CLEARED, do not re-test them:
#   - securityContext (runAsUser / readOnlyRootFilesystem) — see envs/defaults.yaml
#   - the amazon-cloudwatch-observability ADOT addon — its four injected
#     auto-instrumentation init containers all complete (Initialized: True);
#     only the podinfo container fails.
#
# team1-prod is still on its own tag and also crash-looping for the same reason.
# It moves to v0.4 through podinfo_promote_dev_to_prod, not by hand.
image:
  tag: v0.3
replicaCount: 4
