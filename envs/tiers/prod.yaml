# Layer 2/3 — prod tier defaults (clusters labeled tier=prod).
# Progressive delivery is a tier property: every prod-tier environment gets the
# Rollout kind and the canary strategy; envs/<environment>.yaml overrides per env.
workload:
  kind: Rollout
replicaCount: 3
rollout:
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 60
        - pause: {}
        - setWeight: 100

# Synthetic traffic for Continuous Verification.
#
# Deliberately configured on the TIER rung, not in envs/team1-prod.yaml: that
# file is rewritten by the Harness UpdateReleaseRepo step, which re-serialises
# the YAML and DESTROYS every comment in it. Values survive there, explanations
# do not - so anything that needs a reason lives here.
#
# On because podinfo has no real users: without it CV analyses probe traffic
# only and passes unconditionally. See chart/templates/loadgen.yaml.
#
# canaryPath is the failure-rehearsal switch. Flip it to /status/500, run the
# pipeline, and only the CANARY series goes 5xx while probes stay green - the
# verification gate is exercised in isolation from the rollout health gate.
# PUT IT BACK to / afterwards: a permanently failing canary trains everyone to
# approve through the gate, which is worse than not having one.
loadgen:
  enabled: true
  stablePath: /
  # REHEARSAL SWITCH - normally "/". Set to /status/500 to prove the gate still
  # works, then PUT IT BACK. A permanently red canary trains everyone to click
  # through the gate, and every promotion after it would roll back.
  #
  # Rehearsed 2026-08-03 and it worked end to end: canary served ~0.99 5xx/s
  # against a clean stable baseline, Verify at 20 Percent scored the canary host
  # UNHEALTHY (1 anomalous metric) and failed, and StageRollback ran Abort
  # Rollout -> Revert PR -> Merge Revert PR -> Sync Rollback. Prod stayed on the
  # good tag and the bad version never left 20%.
  #
  # START FROM A FULLY-PROMOTED ROLLOUT. With no canary in flight the
  # podinfo-canary Service resolves to the STABLE pods, so this path poisons the
  # stable baseline instead of the canary's - canary and stable then look
  # equally bad and CV correctly finds no anomaly. Check first:
  #   kubectl -n team1-prod get rollout podinfo \
  #     -o jsonpath='{.status.stableRS} {.status.currentPodHash}'
  # The two must be equal before you start.
  canaryPath: /
