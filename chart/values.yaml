replicaCount: 5
revisionHistoryLimit: 5
minReadySeconds: 30

# Workload type: "Rollout" (Argo Rollouts canary; needs a RolloutManager controller in the ns)
# or "Deployment" (classic GitOps, no progressive delivery). Override per env in envs/*.yaml.
workload:
  kind: Rollout

image:
  repository: docker.io/mkandylis/podinfo   # your image (Docker Hub) for the pipeline test
  tag: "v0.1"            # default fallback; env files (envs/*.yaml) set the real tag,
                         # and the pipeline's Update Release Repo bumps image.tag per env
  pullPolicy: IfNotPresent

# Extra flags appended to `./podinfo --port=9898 --level=info`.
#
# THIS IS THE FAILURE-REHEARSAL HOOK. A verification gate you have never seen
# fail is a gate you do not know works, and podinfo ships the switches to prove
# it without needing a deliberately broken image:
#
#   --random-error        1 in 3 responses becomes a 5xx  -> error-rate anomaly
#   --random-delay        0-5s injected latency           -> latency anomaly
#   --stress-cpu=1        pins a core                     -> saturation
#   --unready             never becomes ready             -> rollout stalls, no CV
#
# Set it on ONE environment at a time, in that environment's env file, and
# remove it once the rehearsal is done. Leaving --random-error on a rung that
# applies everywhere would fail every future canary and teach the team to
# ignore the gate - which is worse than having no gate at all.
extraArgs: []

# Synthetic traffic, so Continuous Verification has something real to analyse.
#
# OFF by default - turn it on only where there is no real traffic. See the long
# comment in templates/loadgen.yaml for why this is a prerequisite rather than a
# convenience, and why it must hit BOTH Services.
#
# canaryPath is the failure-rehearsal switch:
#   /            normal - canary and stable both look healthy
#   /status/500  canary returns 5xx, stable does not, probes unaffected
loadgen:
  enabled: false
  replicaCount: 1
  # busybox has wget and nothing else; no shell utilities we do not need.
  image: busybox:1.36
  stablePath: /
  canaryPath: /
  intervalSeconds: 1
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

service:
  port: 9898
  targetPort: 9898
  stableName: podinfo
  canaryName: podinfo-canary

rollout:
  strategy:
    canary:
      maxSurge: 25%
      maxUnavailable: 0
      # Override per env in envs/*.yaml.
      # Use `pause: {}` (indefinite) where the Harness pipeline Verify step
      # should gate promotion. Durational pauses don't trigger Harness CV.
      steps:
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 75
        - pause: { duration: 30s }

analysis:
  enabled: false
  # Prometheus address reachable from the Rollout's AnalysisRun.
  prometheusAddress: http://prometheus-operated.monitoring:9090
  # Max allowable 5xx rate (0 - 1)
  errorRateThreshold: 0.01
  # Max allowable p99 latency in milliseconds
  latencyP99Ms: 500

monitoring:
  enabled: false

ingress:
  enabled: false
  className: traefik
  host: podinfo.local
  annotations: {}

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9898"
  prometheus.io/path: /metrics
podLabels: {}

# Verified against the amd64 image: podinfo starts and serves HTTP under
# readOnlyRootFilesystem AND runAsUser 10001, together and separately. It is
# launched with `--port` and `--level` only, so the write paths behind /store
# are never touched and a read-only root filesystem costs nothing.
# Do NOT loosen these to chase a CrashLoop — see envs/defaults.yaml.
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # Required by the `restricted` Pod Security Standard, which team1-dev and
  # team1-prod enforce. Without it the API server admits the pod but warns:
  #   "would violate PodSecurity restricted:latest: seccompProfile ...
  #    must set securityContext.seccompProfile.type to RuntimeDefault"
  # A warning, not a rejection - so this gap is silent until someone reads
  # the apply output.
  seccompProfile:
    type: RuntimeDefault
