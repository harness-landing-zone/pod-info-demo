# PLAIN SYNC PIPELINE - bump the image tag in git, merge, sync. No progressive
# delivery, no promotion gates.
#
# Targets team1-dev, whose tier file (envs/tiers/nonprod.yaml) sets
# workload.kind: Deployment - so the chart renders a Deployment and Kubernetes'
# own rolling update does the work. There is no Rollout object here and
# therefore nothing for a GitOpsRollout step to act on.
#
# HOW THE IMAGE TAG ACTUALLY MOVES. GitOpsUpdateReleaseRepo does NOT write to
# the Argo Application - it edits the file named by the SERVICE's ReleaseRepo
# manifest (envs/<+env.name>.yaml -> envs/team1-dev.yaml) and raises a PR.
# MergePR merges it, and only then does the sync have anything new to apply.
# Git stays the source of truth, which is why the ApplicationSet needs no
# ignoreDifferences contract.
#
# GOTCHA (doc-confirmed, pr-pipelines-basics.md:132-137): service-level and
# environment-level VARIABLE overrides are merged into the committed file, so
# keys you never listed in this step can appear in envs/team1-dev.yaml. Do not
# try to suppress them with a blank variable.
#
# PREREQUISITE, currently OPEN: service `podinfo` has no ReleaseRepo manifest
# yet, because no connector in this project can reach
# github.com/harness-landing-zone. Until that exists, Update Release Repo has no
# file to edit and this pipeline cannot run.
pipeline:
  name: Podinfo Dev Sync
  identifier: podinfo_dev_sync
  projectIdentifier: selfmanagedargo
  orgIdentifier: gitopsdemo
  description: >-
    Bump podinfo's image tag in envs/team1-dev.yaml and sync the tenant's
    Argo CD Application. Plain rolling update - no canary.
  tags:
    tenant: team1
    pattern: plain-sync
  variables:
    - name: image_tag
      type: String
      description: Image tag to deploy into team1-dev.
      required: true
      value: <+input>
  stages:
    - stage:
        name: Dev
        identifier: dev
        type: Deployment
        spec:
          deploymentType: Kubernetes
          # Makes this a GitOps stage: it binds to GitOps Clusters, NOT to an
          # Infrastructure Definition. Infra definitions are a non-GitOps CD
          # concept and have no meaning here - the namespace comes from the
          # Argo Application's destination.
          gitOpsEnabled: true
          service:
            serviceRef: podinfo
          environment:
            environmentRef: team1_dev
            deployToAll: false
            gitOpsClusters:
              # The tenant's restricted in-cluster destination, registered by
              # its own agent. Bare identifiers: both the agent and the cluster
              # are PROJECT-scoped in selfmanagedargo, so no org. prefix.
              - identifier: team1incluster
                agentIdentifier: team1_argo_agent
          execution:
            steps:
              - step:
                  type: GitOpsUpdateReleaseRepo
                  name: Update Image Tag
                  identifier: updateReleaseRepo
                  timeout: 10m
                  spec:
                    variables:
                      # Dotted path into the values file: image.tag.
                      - name: image.tag
                        type: String
                        value: <+pipeline.variables.image_tag>
                    prTitle: "podinfo team1-dev -> <+pipeline.variables.image_tag>"
                    # Tolerate a re-run with an unchanged tag rather than
                    # failing the stage on an empty diff.
                    allowEmptyCommit: true
              - step:
                  type: MergePR
                  name: Merge PR
                  identifier: mergePR
                  timeout: 10m
                  spec:
                    deleteSourceBranch: true
                    mergeStrategy: merge
              - step:
                  type: GitOpsFetchLinkedApps
                  name: Fetch Linked Apps
                  identifier: fetchLinkedApps
                  timeout: 10m
                  spec:
                    # Resolves Applications by the harness.io/serviceRef and
                    # harness.io/envRef labels the ApplicationSet stamps.
                    filterByServiceEnvCluster: true
              - step:
                  type: GitOpsSync
                  name: Sync
                  identifier: gitopsSync
                  timeout: 10m
                  spec:
                    waitTillHealthy: true
                    prune: false
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    retry: false
                    retryStrategy: {}
                    syncOptions:
                      skipSchemaValidation: false
                      # FALSE. The tenant cannot create namespaces - its cluster
                      # Secret sets clusterResources "false" and AppProject
                      # team1 has an empty clusterResourceWhitelist. team1-dev
                      # is pre-created by the platform at sync wave 0.
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
                      respectIgnoreDifferences: false
                      serverSideApply: false
                    failOnTimeout: true
                    applicationsList:
                      - applicationName: podinfo-team1-dev
                        agentId: team1_argo_agent
            rollbackSteps:
              # Doc-confirmed rollback chain (pr-pipelines-basics.md:477-494):
              # RevertPR using updateReleaseRepoOutcome.commitId, then MergePR,
              # then an optional Sync to force the app back immediately.
              # LIMIT: max TWO MergePR steps per stage - one here, one above.
              - step:
                  type: RevertPR
                  name: Revert PR
                  identifier: revertPR
                  timeout: 10m
                  spec:
                    commitId: <+pipeline.stages.dev.spec.execution.steps.updateReleaseRepo.updateReleaseRepoOutcome.commitId>
              - step:
                  type: MergePR
                  name: Merge Revert PR
                  identifier: mergeRevertPR
                  timeout: 10m
                  spec:
                    deleteSourceBranch: true
                    mergeStrategy: merge
              - step:
                  type: GitOpsSync
                  name: Sync Rollback
                  identifier: syncRollback
                  timeout: 10m
                  spec:
                    waitTillHealthy: true
                    prune: false
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    retry: false
                    retryStrategy: {}
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
                      respectIgnoreDifferences: false
                      serverSideApply: false
                    applicationsList:
                      - applicationName: podinfo-team1-dev
                        agentId: team1_argo_agent
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
