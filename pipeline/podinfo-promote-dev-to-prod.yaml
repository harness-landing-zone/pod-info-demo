pipeline:
  name: Podinfo Promote Dev to Prod
  identifier: podinfo_promote_dev_to_prod
  projectIdentifier: selfmanagedargo
  orgIdentifier: gitopsdemo
  description: >-
    Promote one podinfo image tag from team1-dev to team1-prod. Dev is a plain
    sync; prod is an Argo Rollouts canary gated at 20 and 60 percent, with a
    manual approval between the two environments.
  tags:
    tenant: team1
    pattern: promotion
  variables:
    - name: image_tag
      type: String
      description: Image tag to promote from team1-dev through to team1-prod.
      required: true
      value: <+input>
  stages:
    - stage:
        name: Dev
        identifier: dev
        type: Deployment
        spec:
          deploymentType: Kubernetes
          gitOpsEnabled: true
          service:
            serviceRef: podinfo
          environment:
            environmentRef: team1_dev
            deployToAll: false
            gitOpsClusters:
              - identifier: team1incluster
                agentIdentifier: team1_argo_agent
          execution:
            steps:
              - step:
                  type: GitOpsUpdateReleaseRepo
                  name: Update Image Tag
                  identifier: updateReleaseRepo
                  timeout: 10m
                  spec:
                    variables:
                      - name: image.tag
                        type: String
                        value: <+pipeline.variables.image_tag>
                    prTitle: "podinfo team1-dev -> <+pipeline.variables.image_tag>"
                    allowEmptyCommit: true
              - step:
                  type: MergePR
                  name: Merge PR
                  identifier: mergePR
                  timeout: 10m
                  spec:
                    deleteSourceBranch: true
                    mergeStrategy: merge
              - step:
                  type: GitOpsFetchLinkedApps
                  name: Fetch Linked Apps
                  identifier: fetchLinkedApps
                  timeout: 10m
                  spec:
                    # Resolves Applications from the ApplicationSet referenced by
                    # the service's appsetConfigs (App Set Reference), filtered to
                    # this stage's service + environment. The appset is the source
                    # of truth for which apps exist, so adding an environment or a
                    # cluster to it needs no pipeline edit.
                    filterByServiceEnvCluster: true
              - step:
                  type: GitOpsSync
                  name: Sync Dev
                  identifier: gitopsSync
                  timeout: 10m
                  spec:
                    waitTillHealthy: true
                    prune: false
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    retry: false
                    retryStrategy: {}
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
                      respectIgnoreDifferences: false
                      serverSideApply: true
                    failOnTimeout: true
            rollbackSteps:
              - step:
                  type: RevertPR
                  name: Revert PR
                  identifier: revertPR
                  timeout: 10m
                  spec:
                    commitId: <+pipeline.stages.dev.spec.execution.steps.updateReleaseRepo.updateReleaseRepoOutcome.commitId>
              - step:
                  type: MergePR
                  name: Merge Revert PR
                  identifier: mergeRevertPR
                  timeout: 10m
                  spec:
                    deleteSourceBranch: true
                    mergeStrategy: merge
              - step:
                  type: GitOpsSync
                  name: Sync Rollback
                  identifier: syncRollback
                  timeout: 10m
                  spec:
                    waitTillHealthy: true
                    prune: false
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    retry: false
                    retryStrategy: {}
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
                      respectIgnoreDifferences: false
                      serverSideApply: true
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: Approve Prod
        identifier: approve_prod
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Approve Promotion to Prod
                  identifier: approveProd
                  timeout: 1d
                  spec:
                    approvalMessage: >-
                      podinfo <+pipeline.variables.image_tag> is Healthy in
                      team1-dev. Approve promotion to team1-prod. The canary
                      then gates again at 20 and 60 percent.
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - account._account_all_users
                    approverInputs: []
    - stage:
        name: Prod Canary
        identifier: prod_canary
        type: Deployment
        spec:
          deploymentType: Kubernetes
          gitOpsEnabled: true
          service:
            serviceRef: podinfo
          environment:
            environmentRef: team1_prod
            deployToAll: false
            gitOpsClusters:
              - identifier: team1incluster
                agentIdentifier: team1_argo_agent
          execution:
            steps:
              - step:
                  type: GitOpsUpdateReleaseRepo
                  name: Update Image Tag
                  identifier: updateReleaseRepo
                  timeout: 10m
                  spec:
                    variables:
                      - name: image.tag
                        type: String
                        value: <+pipeline.variables.image_tag>
                    prTitle: "podinfo team1-prod -> <+pipeline.variables.image_tag>"
                    allowEmptyCommit: true
              - step:
                  type: MergePR
                  name: Merge PR
                  identifier: mergePR
                  timeout: 10m
                  spec:
                    deleteSourceBranch: true
                    mergeStrategy: merge
              - step:
                  type: GitOpsFetchLinkedApps
                  name: Fetch Linked Apps
                  identifier: fetchLinkedApps
                  timeout: 10m
                  spec:
                    # Resolves Applications from the ApplicationSet referenced by
                    # the service's appsetConfigs (App Set Reference), filtered to
                    # this stage's service + environment. The appset is the source
                    # of truth for which apps exist, so adding an environment or a
                    # cluster to it needs no pipeline edit.
                    filterByServiceEnvCluster: true
              - step:
                  type: GitOpsSync
                  name: Sync starts canary at 20 percent
                  identifier: gitopsSync
                  timeout: 10m
                  spec:
                    waitTillHealthy: false
                    prune: false
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    retry: false
                    retryStrategy: {}
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
                      respectIgnoreDifferences: false
                      serverSideApply: true
              - step:
                  type: Verify
                  name: Verify at 20 Percent
                  identifier: verifyAt20
                  timeout: 2h
                  spec:
                    isMultiServicesOrEnvs: false
                    # Canary compares the NEW pods against the STABLE pods over the
                    # analysis window. It needs series from BOTH, which is why the
                    # chart emits a ServiceMonitor per Service (stable AND canary)
                    # and why the loadgen drives traffic at both.
                    type: Canary
                    # Default resolves the Monitored Service from this stage's
                    # service + environment: podinfo + team1_prod ->
                    # podinfo_team1_prod, health source prometheus_eks.
                    monitoredService:
                      type: Default
                      spec: {}
                    spec:
                      sensitivity: HIGH
                      duration: 5m
                    # FAIL WHEN THERE IS NOTHING TO ANALYSE. Default is false,
                    # and false means a Verify step with ZERO collected data
                    # returns VERIFICATION_PASSED / HEALTHY - a green gate over
                    # an unexamined canary.
                    #
                    # Observed, not theorised: a canary serving ~1.0 5xx/s was
                    # passed because every host came back NO_ANALYSIS. The
                    # failureStrategies below could not catch it - Harness never
                    # reports Unknown in that case, it reports success. This
                    # setting is the only thing that closes it.
                    failOnNoAnalysis: true
                  failureStrategies:
                    # FAIL CLOSED, on both branches.
                    #
                    # Verification = CV saw an anomaly. Roll the stage back rather
                    # than advancing the canary to more users.
                    #
                    # Unknown = CV could not reach a verdict (no data, Prometheus
                    # unreachable, query returned nothing). That is NOT a pass. A
                    # gate that promotes when it cannot see is worse than no gate,
                    # because it reads as protection. Treat it the same as a
                    # failure and make someone look.
                    - onFailure:
                        errors:
                          - Verification
                        action:
                          type: StageRollback
                    - onFailure:
                        errors:
                          - Unknown
                        action:
                          type: StageRollback
              - step:
                  type: GitOpsRollout
                  name: Promote to 60 Percent
                  identifier: promoteTo60
                  timeout: 15m
                  spec:
                    appName: podinfo-team1-prod
                    agentIdentifier: team1_argo_agent
                    namespace: team1-prod
                    rolloutName: podinfo
                    waitUntilHealthStatus:
                      healthStatus: Suspended
                    autoRolloutAction: resume
              - step:
                  type: Verify
                  name: Verify at 60 Percent
                  identifier: verifyAt60
                  timeout: 2h
                  spec:
                    isMultiServicesOrEnvs: false
                    # Canary compares the NEW pods against the STABLE pods over the
                    # analysis window. It needs series from BOTH, which is why the
                    # chart emits a ServiceMonitor per Service (stable AND canary)
                    # and why the loadgen drives traffic at both.
                    type: Canary
                    # Default resolves the Monitored Service from this stage's
                    # service + environment: podinfo + team1_prod ->
                    # podinfo_team1_prod, health source prometheus_eks.
                    monitoredService:
                      type: Default
                      spec: {}
                    spec:
                      sensitivity: HIGH
                      duration: 5m
                    # FAIL WHEN THERE IS NOTHING TO ANALYSE. Default is false,
                    # and false means a Verify step with ZERO collected data
                    # returns VERIFICATION_PASSED / HEALTHY - a green gate over
                    # an unexamined canary.
                    #
                    # Observed, not theorised: a canary serving ~1.0 5xx/s was
                    # passed because every host came back NO_ANALYSIS. The
                    # failureStrategies below could not catch it - Harness never
                    # reports Unknown in that case, it reports success. This
                    # setting is the only thing that closes it.
                    failOnNoAnalysis: true
                  failureStrategies:
                    # FAIL CLOSED, on both branches.
                    #
                    # Verification = CV saw an anomaly. Roll the stage back rather
                    # than advancing the canary to more users.
                    #
                    # Unknown = CV could not reach a verdict (no data, Prometheus
                    # unreachable, query returned nothing). That is NOT a pass. A
                    # gate that promotes when it cannot see is worse than no gate,
                    # because it reads as protection. Treat it the same as a
                    # failure and make someone look.
                    - onFailure:
                        errors:
                          - Verification
                        action:
                          type: StageRollback
                    - onFailure:
                        errors:
                          - Unknown
                        action:
                          type: StageRollback
              - step:
                  type: GitOpsRollout
                  name: Promote to 100 Percent
                  identifier: promoteTo100
                  timeout: 15m
                  spec:
                    appName: podinfo-team1-prod
                    agentIdentifier: team1_argo_agent
                    namespace: team1-prod
                    rolloutName: podinfo
                    waitUntilHealthStatus:
                      healthStatus: Suspended
                    autoRolloutAction: promote-full
            rollbackSteps:
              - step:
                  type: GitOpsRollout
                  name: Abort Rollout
                  identifier: abortRollout
                  timeout: 10m
                  spec:
                    appName: podinfo-team1-prod
                    agentIdentifier: team1_argo_agent
                    namespace: team1-prod
                    rolloutName: podinfo
                    autoRolloutAction: abort
              - step:
                  type: RevertPR
                  name: Revert PR
                  identifier: revertPR
                  timeout: 10m
                  spec:
                    commitId: <+pipeline.stages.prod_canary.spec.execution.steps.updateReleaseRepo.updateReleaseRepoOutcome.commitId>
              - step:
                  type: MergePR
                  name: Merge Revert PR
                  identifier: mergeRevertPR
                  timeout: 10m
                  spec:
                    deleteSourceBranch: true
                    mergeStrategy: merge
              - step:
                  type: GitOpsSync
                  name: Sync Rollback
                  identifier: syncRollback
                  timeout: 10m
                  spec:
                    waitTillHealthy: false
                    prune: false
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    retry: false
                    retryStrategy: {}
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
                      respectIgnoreDifferences: false
                      serverSideApply: true
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
