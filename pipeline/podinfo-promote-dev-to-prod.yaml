# THE RECOMMENDED SHAPE - one pipeline, one image tag, promoted Dev -> Approval
# -> Prod. This is the pattern Harness's own worked example uses
# (argo-rollouts-with-cv.md:463-1184: Dev_Deploy -> QA_Deploy -> Approval ->
# Prod_Deploy -> Approval -> Preprod, all in ONE pipeline).
#
# The two single-purpose pipelines next to this file still exist and are still
# useful - podinfo-dev-sync.yaml demos a plain rolling update in isolation, and
# podinfo-prod-canary.yaml demos the Argo Rollouts canary in isolation. THIS one
# is what you would actually run, because it guarantees the artifact that
# reaches prod is the one that was validated in dev: a single pipeline variable
# feeds both stages, so the two cannot drift.
#
# WHY NOT AN ENVIRONMENT GROUP. Environment Groups look like the right tool and
# are not: create-environment-groups.md:89 - "Harness will loop through each
# environment in the environment group and deploy". That is parallel fan-out
# across same-tier environments, not a gated promotion with different behaviour
# per environment. Dev here is a plain sync; Prod is a gated canary. They must
# be separate stages.
#
# WHY THE STAGES DIFFER. workload.kind is a TIER property:
# envs/tiers/nonprod.yaml renders a Deployment (Kubernetes rolling update, no
# Rollout object exists), envs/tiers/prod.yaml renders a Rollout with the canary
# ladder. So the Dev stage has no GitOpsRollout steps and cannot - there is
# nothing for them to act on.
#
# CHANGE FREEZE DOES NOT APPLY HERE. deployment-freeze.md:11, verbatim:
# "Deployment freeze does not apply to Harness GitOps PR pipelines." Do not rely
# on a Production freeze window to hold this pipeline. Use ArgoCD Sync Windows
# on AppProject team1, or an OPA policy on the GitOps Application.
#
# FEATURE FLAG: GitOpsRollout requires CDS_GITOPS_ENABLE_ROLLOUTS_PIPELINE_UX on
# the account (managing-rollouts-in-harness-pipelines.md:223-225).
#
# NOTE ON INLINE vs REMOTE: this file is the readable source of truth, but the
# live entity in Harness is INLINE. The two can drift - keep them in step by
# hand, or move the pipeline to a remote (Git Experience) store using the
# account-level `generic` connector, which already points at this repo.
pipeline:
  name: Podinfo Promote Dev to Prod
  identifier: podinfo_promote_dev_to_prod
  projectIdentifier: selfmanagedargo
  orgIdentifier: gitopsdemo
  description: >-
    Promote one podinfo image tag from team1-dev to team1-prod. Dev is a plain
    sync; prod is an Argo Rollouts canary gated at 20 and 60 percent, with a
    manual approval between the two environments.
  tags:
    tenant: team1
    pattern: promotion
  variables:
    # ONE variable, both stages. This is the whole point of the combined
    # pipeline: prod cannot receive a tag that dev did not run.
    - name: image_tag
      type: String
      description: Image tag to promote from team1-dev through to team1-prod.
      required: true
      value: <+input>
  stages:
    # ---------------------------------------------------------------- DEV ----
    - stage:
        name: Dev
        identifier: dev
        type: Deployment
        spec:
          deploymentType: Kubernetes
          gitOpsEnabled: true
          service:
            serviceRef: podinfo
          environment:
            environmentRef: team1_dev
            deployToAll: false
            gitOpsClusters:
              - identifier: team1incluster
                agentIdentifier: team1_argo_agent
          execution:
            steps:
              - step:
                  type: GitOpsUpdateReleaseRepo
                  name: Update Image Tag
                  identifier: updateReleaseRepo
                  timeout: 10m
                  spec:
                    variables:
                      - name: image.tag
                        type: String
                        value: <+pipeline.variables.image_tag>
                    prTitle: "podinfo team1-dev -> <+pipeline.variables.image_tag>"
                    allowEmptyCommit: true
              - step:
                  type: MergePR
                  name: Merge PR
                  identifier: mergePR
                  timeout: 10m
                  spec:
                    deleteSourceBranch: true
                    mergeStrategy: merge
              - step:
                  type: GitOpsFetchLinkedApps
                  name: Fetch Linked Apps
                  identifier: fetchLinkedApps
                  timeout: 10m
                  spec:
                    filterByServiceEnvCluster: true
              - step:
                  type: GitOpsSync
                  name: Sync Dev
                  identifier: gitopsSync
                  timeout: 10m
                  spec:
                    # TRUE here, unlike prod: a Deployment reaches Healthy on
                    # its own, so waiting is a real gate on dev succeeding
                    # before the promotion approval is even offered.
                    waitTillHealthy: true
                    prune: false
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    retry: false
                    retryStrategy: {}
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
                      respectIgnoreDifferences: false
                      serverSideApply: false
                    failOnTimeout: true
                    applicationsList:
                      - applicationName: podinfo-team1-dev
                        agentId: team1_argo_agent
            rollbackSteps:
              - step:
                  type: RevertPR
                  name: Revert PR
                  identifier: revertPR
                  timeout: 10m
                  spec:
                    commitId: <+pipeline.stages.dev.spec.execution.steps.updateReleaseRepo.updateReleaseRepoOutcome.commitId>
              - step:
                  type: MergePR
                  name: Merge Revert PR
                  identifier: mergeRevertPR
                  timeout: 10m
                  spec:
                    deleteSourceBranch: true
                    mergeStrategy: merge
              - step:
                  type: GitOpsSync
                  name: Sync Rollback
                  identifier: syncRollback
                  timeout: 10m
                  spec:
                    waitTillHealthy: true
                    prune: false
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    retry: false
                    retryStrategy: {}
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
                      respectIgnoreDifferences: false
                      serverSideApply: false
                    applicationsList:
                      - applicationName: podinfo-team1-dev
                        agentId: team1_argo_agent
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    # ----------------------------------------------------------- APPROVAL ----
    # Its own stage, between deploys - adding-harness-approval-stages.md:13
    # ("Approvals are added in between Stages") and :27-28 (never in parallel).
    - stage:
        name: Approve Prod
        identifier: approve_prod
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Approve Promotion to Prod
                  identifier: approveProd
                  timeout: 1d
                  spec:
                    approvalMessage: >-
                      podinfo <+pipeline.variables.image_tag> is Healthy in
                      team1-dev. Approve promotion to team1-prod. The canary
                      then gates again at 20 and 60 percent.
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - account._account_all_users
                    approverInputs: []
    # --------------------------------------------------------------- PROD ----
    - stage:
        name: Prod Canary
        identifier: prod_canary
        type: Deployment
        spec:
          deploymentType: Kubernetes
          gitOpsEnabled: true
          service:
            serviceRef: podinfo
          environment:
            environmentRef: team1_prod
            deployToAll: false
            gitOpsClusters:
              - identifier: team1incluster
                agentIdentifier: team1_argo_agent
          execution:
            steps:
              - step:
                  type: GitOpsUpdateReleaseRepo
                  name: Update Image Tag
                  identifier: updateReleaseRepo
                  timeout: 10m
                  spec:
                    variables:
                      - name: image.tag
                        type: String
                        # The SAME pipeline variable dev used.
                        value: <+pipeline.variables.image_tag>
                    prTitle: "podinfo team1-prod -> <+pipeline.variables.image_tag>"
                    allowEmptyCommit: true
              - step:
                  type: MergePR
                  name: Merge PR
                  identifier: mergePR
                  timeout: 10m
                  spec:
                    deleteSourceBranch: true
                    mergeStrategy: merge
              - step:
                  type: GitOpsFetchLinkedApps
                  name: Fetch Linked Apps
                  identifier: fetchLinkedApps
                  timeout: 10m
                  spec:
                    filterByServiceEnvCluster: true
              - step:
                  type: GitOpsSync
                  name: Sync starts canary at 20 percent
                  identifier: gitopsSync
                  timeout: 10m
                  spec:
                    # FALSE: a Rollout parked on an indefinite pause reports
                    # Suspended and never reaches Healthy until promoted.
                    waitTillHealthy: false
                    prune: false
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    retry: false
                    retryStrategy: {}
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
                      respectIgnoreDifferences: false
                      serverSideApply: false
                    failOnTimeout: true
                    applicationsList:
                      - applicationName: podinfo-team1-prod
                        agentId: team1_argo_agent
                  # NO autoPromoteRolloutBehavior. Its enum is only
                  # ["promote-full","resume"] - there is no "none" - so omitting
                  # it is the ONLY way to let the canary stop at its first
                  # pause. Setting promote-full drives it to 100% on sync and
                  # every gate below becomes decorative.
              - step:
                  type: Wait
                  name: Soak at 20 Percent
                  identifier: soakAt20
                  spec:
                    duration: 2m
              - step:
                  type: GitOpsRollout
                  name: Promote to 60 Percent
                  identifier: promoteTo60
                  timeout: 15m
                  spec:
                    appName: podinfo-team1-prod
                    agentIdentifier: team1_argo_agent
                    namespace: team1-prod
                    # Release-name independent: the chart's fullname helper
                    # always yields `podinfo`, in every namespace.
                    rolloutName: podinfo
                    waitUntilHealthStatus:
                      healthStatus: Suspended
                    autoRolloutAction: resume
              - step:
                  type: Wait
                  name: Soak at 60 Percent
                  identifier: soakAt60
                  spec:
                    duration: 2m
              - step:
                  type: GitOpsRollout
                  name: Promote to 100 Percent
                  identifier: promoteTo100
                  timeout: 15m
                  spec:
                    appName: podinfo-team1-prod
                    agentIdentifier: team1_argo_agent
                    namespace: team1-prod
                    rolloutName: podinfo
                    waitUntilHealthStatus:
                      healthStatus: Suspended
                    autoRolloutAction: promote-full
            rollbackSteps:
              # abort -> revert -> sync, the order Harness's own canary example
              # uses (argo-rollouts-with-cv.md:1012-1055). Abort returns traffic
              # to stable immediately; reverting git alone would leave the
              # canary parked at its current weight.
              - step:
                  type: GitOpsRollout
                  name: Abort Rollout
                  identifier: abortRollout
                  timeout: 10m
                  spec:
                    appName: podinfo-team1-prod
                    agentIdentifier: team1_argo_agent
                    namespace: team1-prod
                    rolloutName: podinfo
                    autoRolloutAction: abort
              - step:
                  type: RevertPR
                  name: Revert PR
                  identifier: revertPR
                  timeout: 10m
                  spec:
                    commitId: <+pipeline.stages.prod_canary.spec.execution.steps.updateReleaseRepo.updateReleaseRepoOutcome.commitId>
              - step:
                  type: MergePR
                  name: Merge Revert PR
                  identifier: mergeRevertPR
                  timeout: 10m
                  spec:
                    deleteSourceBranch: true
                    mergeStrategy: merge
              - step:
                  type: GitOpsSync
                  name: Sync Rollback
                  identifier: syncRollback
                  timeout: 10m
                  spec:
                    waitTillHealthy: false
                    prune: false
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    retry: false
                    retryStrategy: {}
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
                      respectIgnoreDifferences: false
                      serverSideApply: false
                    applicationsList:
                      - applicationName: podinfo-team1-prod
                        agentId: team1_argo_agent
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
