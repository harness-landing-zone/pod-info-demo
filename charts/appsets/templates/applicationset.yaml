{{- /*
ONE ApplicationSet for the tenant: one Application per environment, all of them
landing on the SINGLE registered destination (team1-in-cluster).

A LIST GENERATOR, NOT A CLUSTERS GENERATOR - and that is forced, not taste. This
tenant's Argo has exactly one cluster Secret (team1-in-cluster, authored by the
platform's tenant-platform chart) and it serves BOTH workload namespaces. A
clusters generator emits one Application PER MATCHED CLUSTER, so it could never
yield two environments here. Worse, that Secret carries no `environment` or
`tier` label, and with goTemplateOptions missingkey=error, reading
.metadata.labels.environment off it fails generation OUTRIGHT rather than
degrading. Environments are therefore data in values, not cluster labels.

NO syncPolicy.automated, DELIBERATELY. The Harness pipeline is the promoter for
every environment - each stage runs UpdateReleaseRepo -> MergePR -> GitOpsSync -
so an automated sync would race the canary and make the GitOps Sync step
meaningless as a control point. This preserves the decision the tenant's previous
Application already carried.

`project` is the PLATFORM-OWNED AppProject team1, the one mapped to Harness
gitopsdemo/selfmanagedargo. This chart deliberately creates NO AppProject: a
tenant minting its own would be the tenant authoring its own wall, and an
Application filed under any other project is invisible to the pipeline.

ArgoCD templates are escaped from Helm with backtick quoting.
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.appName }}-{{ .Values.team }}
  namespace: {{ .Values.argocdNamespace }}
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          {{- toYaml .Values.environments | nindent 10 }}
  template:
    metadata:
      name: '{{ .Values.appName }}-{{`{{ .env }}`}}'
      annotations:
        {{- /* REQUIRED once this app contains ANY CRD-typed resource.

        The Application syncs with ServerSideApply=true. Argo's server-side diff
        uses Kubernetes' structured-merge-diff, which is schema-aware, and it
        could not resolve a type for our ServiceMonitors:

          ComparisonError: ... error calculating structured merge diff:
          unable to resolve parseableType for GroupVersionKind:
          monitoring.coreos.com/v1, Kind=ServiceMonitor

        The failure mode is CONFUSING because it contradicts itself: the sync
        SUCCEEDS ("phase=Succeeded, successfully synced" - server-side apply runs
        in the API server, which knows its own CRDs) while the Application reports
        sync=Unknown. Only Argo's client-side PREDICTION of the diff breaks, so
        you lose drift detection while deployments keep working.

        NOT an RBAC problem, and specifically NOT a consequence of this tenant
        holding zero ClusterRoles. CRD schemas come from /openapi/v2 and
        /openapi/v3, which system:discovery grants to system:authenticated - every
        ServiceAccount can already read them. Verified with `auth can-i get
        /openapi/v2`. Do not "fix" this by granting the tenant a cluster-scoped
        read; it buys nothing and cracks the wall for no reason.

        Falls back to client-side diffing. Server-side APPLY is unaffected, so the
        field-ownership behaviour we rely on (removing a key from git actually
        removes it from the cluster) still holds. */}}
        argocd.argoproj.io/compare-options: ServerSideDiff=false
      labels:
        {{- /* These two MUST be the Harness service and environment
        IDENTIFIERS (podinfo, team1_dev / team1_prod), not display names. They
        are what links each generated Application to its Harness service and
        environment so the pipeline can resolve it. */}}
        harness.io/serviceRef: {{ .Values.service }}
        harness.io/envRef: '{{`{{ .envRef }}`}}'
        app: {{ .Values.appName }}
        environment: '{{`{{ .env }}`}}'
        team: {{ .Values.team }}
    spec:
      project: {{ .Values.project }}
      {{- /* Multi-source: the chart is one source, the same repo mounted as
      `values` is the other. valueFiles cannot climb out of the chart directory
      on a single source, so the $values ref is what lets envs/ live at the repo
      root and stay pipeline-editable without touching the chart. */}}
      sources:
        - repoURL: {{ .Values.repoURL }}
          targetRevision: {{ .Values.targetRevision }}
          path: chart
          helm:
            releaseName: '{{ .Values.appName }}-{{`{{ .env }}`}}'
            ignoreMissingValueFiles: true
            {{- /* Layered, last wins: global -> tier -> environment. The env
            file is the one GitOpsUpdateReleaseRepo rewrites image.tag in, so its
            NAME must match the Harness environment name - the service's
            ReleaseRepo path is envs/<+env.name>.yaml and the two must agree. */}}
            valueFiles:
              - "$values/envs/defaults.yaml"
              - "$values/envs/tiers/{{`{{ .tier }}`}}.yaml"
              - "$values/envs/{{`{{ .env }}`}}.yaml"
        - repoURL: {{ .Values.repoURL }}
          targetRevision: {{ .Values.targetRevision }}
          ref: values
      destination:
        {{- /* BY NAME, not by server. The tenant's argocd-cm sets
        cluster.inClusterEnabled "false", so the implicit in-cluster destination
        does not exist. The only destination is this declared, restricted Secret,
        and AppProject team1 lists its destinations by that name too - so a
        server-form destination is rejected at admission. */}}
        name: {{ .Values.destinationCluster }}
        namespace: '{{`{{ .env }}`}}'
      ignoreDifferences:
        {{- /* argo-rollouts rewrites the stable/canary Service selectors during
        a rollout; without this every canary reports the app OutOfSync. */}}
        - group: ""
          kind: Service
          jsonPointers:
            - /spec/selector
      syncPolicy:
        syncOptions:
          {{- /* FALSE, and it has to be. The cluster Secret sets
          clusterResources "false" and AppProject team1 has
          clusterResourceWhitelist: [], so creating a Namespace is denied at two
          independent walls. team1-platform pre-creates team1-dev and team1-prod
          at sync wave 0. */}}
          - CreateNamespace=false
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
